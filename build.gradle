buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
    id 'org.jetbrains.kotlin.plugin.serialization' version '1.9.22'
    id 'org.spongepowered.mixin' version '0.7.+'
}
group = mod_group_id
version = minecraft_version + '-' + mod_version

base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client { property 'forge.enabledGameTestNamespaces', mod_id }
        server { property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui' }
        gameTestServer { property 'forge.enabledGameTestNamespaces', mod_id }
        data { workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/') }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { name = "CurseForge Maven"
        url = "https://cursemaven.com"
        content { includeGroup("curse.maven") } }
    maven { name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content { includeGroup("maven.modrinth") } }
    maven { name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/' }
    maven { name = "Jared's maven"
        url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.theillusivec4.top/" }
    maven { url = 'https://maven.tterrag.com/'}
    maven { name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { name = "Valkyrien Skies Internal"
        url = "https://maven.valkyrienskies.org" }
    maven { name = "Squiddev maven cct"
        url = "https://maven.squiddev.cc/"
        content {includeGroup("cc.tweaked")
            includeModule("org.squiddev", "Cobalt") } }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url "https://maven.firstdarkdev.xyz/snapshots" }

    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    jarJar(group: 'com.tterrag.registrate', name: 'Registrate', version: "[MC1.19.3,MC1.20)")

    compileOnly ("org.valkyrienskies.core:api:${vs_core_version}")
    compileOnly ("org.valkyrienskies.core:impl:${vs_core_version}")
    compileOnly ("org.valkyrienskies.core:api-game:${vs_core_version}")
    compileOnly ("org.valkyrienskies.core:util:${vs_core_version}")
    implementation fg.deobf("org.valkyrienskies:valkyrienskies-120-forge:${vs2_version}")

    implementation fg.deobf("maven.modrinth:cosmic-horizons-cosmos:${cosmos_version}")
    implementation fg.deobf("curse.maven:starlance-1130106:6419355")
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.2')
    implementation 'thedarkcolour:kotlinforforge:4.10.0'
    implementation fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")

    implementation fg.deobf("com.simibubi.create:create-${create_minecraft_version}:${create_version}:slim") { transitive = false }
    implementation fg.deobf("com.jozufozu.flywheel:flywheel-forge-${flywheel_minecraft_version}:${flywheel_version}")

    //runtimeOnly fg.deobf(files("libs/rubidium-extra-0.5.4.4+mc1.20.1-build.131.jar"))
    //runtimeOnly fg.deobf(files("libs/oculus-mc1.20.1-1.8.0.jar")) { exclude group: 'org.spongepowered', module: 'mixin' }
    //runtimeOnly fg.deobf(files("libs/embeddium-0.3.31+mc1.20.1.jar")) { exclude group: 'org.spongepowered', module: 'mixin' }
    //runtimeOnly files("libs/Shimmer-forge-1.20.1-0.2.4.jar")
    //runtimeOnly fg.deobf(files("libs/yesstevemodel-forge-1.20-2.2.2.jar")) //炸了

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            vs2_version: vs2_version.split("\\+").first(),
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties + [project: project] }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                cosmos_version: cosmos_version
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }